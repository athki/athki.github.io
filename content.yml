site:
  name: Christian Pfrang
  url: https://www.christianpfrang.com
  # <title> of the homepage and the text search engines / link previews show
  title: Christian Pfrang — Building computable commerce
  description: >-
    Christian Pfrang is building tools for using agents in highly regulated environments. Examples include:
    verified invoicing, ultimate beneficial ownership checks, and DNS-based merchant verification for x402.
  # The address shown in the contact band and used by every "Email" link.
  email: hello@christianpfrang.com        # forwarding alias; set it up at your mail provider before going live
  og_image: images/og.png

# Top navigation, left to right.
nav:
  - label: Home
    href: index.html
  - label: Artifacts
    href: artifacts.html

hero:
  headline: Building computable commerce.
  # Leave a blank line between paragraphs. Links: [link text](https://...)
  lead: >-
    Personal shopping agents are the first wave of what is coming:
    Automated economic decision making at scale. Agents can only go as
    fast as they can check the rules are followed and their counterparty is trustworthy.
    That is the emerging bottleneck. I'm interested in building tools and infrastructure that alleviate this bottleneck.

    Code verification and cryptography are the building blocks that can make the agentic economy trustworthy. I run the [Lean in Munich meetup](https://luma.com/user/usr-mYj1Mw12kCdvDSb),
    and was a guest lecturer in cryptography at Technical University of Munich.

    I've built an MCP server that generates compliant invoices via chat, an AI tool that calculates beneficial ownership
    from private documents in minutes and a simple DNS-based merchant verification framework for
    x402 resource servers. I use cryptography and formal languages to make sure that every decision remains explainable, auditable and within constraints.

    This world requires builders that can interface with governments and understand the liabilities that can arise in moving real money. I've done both.

  # Small heading above the proof lines. Leave it "" to hide it.
  proof_heading: Background
  proof:
    - Director General, Bavarian Ministry of Digital Affairs: Cloud and AI strategy · EU digital regulation · international affairs
    - Derivs Trader & Quant: JPMorgan, Highbridge Capital
    - Lex columnist, Financial Times: Analyzing the intersection of regulation, geopolitics and business
    - Academics: PhD Applied Mathematics, Brown · Guest Scientist, TUM
  cta: Get in touch
  secondary: See what I'm building ↓

building:
  heading: What I'm building
  # link and link_text are optional: add them to a card to make it clickable.
  cards:
    - name: Verified invoicing
      status: Working prototype
      link: https://ai-e-rechnung.christianpfrang.com
      link_text: See how it works →
      text: Invoices from chat. Auditable, and explainable, generated from code verified against the legal rules a tax adviser checks.
    - name: Ownership (UBO) checker
      status: In development
      text: >-
        Determining a UBO requires following control relationships that emerge from private documents, not public registers.
        I'm building tools that provably follow the applicable rules, without revealing private information.
    - name: Verified payee for x402
      status: Working prototype
      link: https://x402-merchant-verification.christianpfrang.com
      link_text: See how it works →
      text: A key in your DNS record binds a wallet to your domain, so an agent can check before paying.

services:
  heading: How I can help you
  intro: "I fund myself by working with investors and companies that are advancing the same frontier:"
  cards:
    - name: Formal verification
      who: For investment teams
      question: What's real, who's serious, and what to ask a founder.
      belief: >-
        I brief you on my two theses: 1) If it's not worth verifying, then it's not worth engineering.
        2) Legal services can scale and automate through formally verified code.
      format: briefing + memo.
      link: Get in touch ↓
    - name: Trust design review
      who: For teams building harnesses that want to harden them with verification and cryptography
      question: How to enforce deterministic constraints and create auditable evidence traces
      belief: >-
        Trusting agents is a cryptography problem: identity, access, delegation,
        and auditability.
      format: Half-day review + memo.
      link: Get in touch ↓
    - name: Frontier regulation in AI, compute and commerce
      who: For CFOs, policy teams, compliance leads and investors
      question: What emerging policy areas are critical for my business and investments?
      belief: >-
        The shape of future commerce is already written in the AI Act, GENIUS
        Act, MiCA, and AML law. I bring the global picture together for you.
      format: briefing, workshop, memo
      link: Get in touch ↓

