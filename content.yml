site:
  name: Christian Pfrang
  url: https://www.christianpfrang.com
  # <title> of the homepage and the text search engines / link previews show
  title: Christian Pfrang — Building computable commerce
  description: >-
    Christian Pfrang builds the pieces that let software agents buy, sell and
    sign within the law: verified invoicing, ownership checks, and a verified
    payee for x402. Former Director General, Bavarian Ministry of Digital Affairs.
  # The address shown in the contact band and used by every "Email" link.
  email: hello@christianpfrang.com        # forwarding alias; set it up at your mail provider before going live
  og_image: images/og.png

# Top navigation, left to right.
nav:
  - label: Home
    href: index.html
  - label: Artifacts
    href: artifacts.html

hero:
  headline: Building computable commerce.
  lead: >-
    Software agents are starting to buy, sell, and sign. They can only go as
    fast as the rules can be checked. I build the pieces that make the rules
    computable: a verifier that checks an invoice in milliseconds, an ownership
    check an agent runs before it pays, and a key in DNS that proves who it's
    paying. Where the rules can't be computed yet, I work with the people who
    write them. Each piece leaves evidence that holds up in a dispute.
  proof:
    - Former Director General, Bavarian Ministry of Digital Affairs · Shaped the EU Data Act and AI Act
    - Lex columnist, Financial Times · Highbridge Capital · PhD Applied Mathematics, Brown · Lecturer, TUM
  cta: Email me
  cta_subject: Hello from christianpfrang.com
  secondary: See what I'm building ↓

building:
  heading: What I'm building
  cards:
    - name: Verified invoicing
      status: Working prototype
      text: Invoices from code verified against the legal rules a tax adviser checks.
    - name: Ownership (UBO) checker
      status: In development
      text: Who are you actually dealing with? A UBO check an agent runs before it pays.
    - name: Verified payee for x402
      status: Working prototype · spec in draft
      text: A key in your DNS record binds a wallet to your domain, so an agent can check before paying.

services:
  heading: Working with me
  intro: "Building this is funded by work with investors and technology companies on the same frontier:"
  cards:
    - name: Formal verification
      who: For investment teams
      question: What's real, who's serious, and what to ask a founder.
      belief: >-
        Two stories: verification is becoming the whole of software engineering,
        and it is how legal services will scale.
      format: 90-minute briefing + memo.
      link: Email about a briefing →
      subject: Briefing on formal verification
    - name: Trust design review
      who: For teams whose agents pay
      question: Who the agent acts for, who it pays, what evidence it leaves.
      belief: >-
        Trusting agents is a cryptography problem: identity, access, delegation,
        and auditability.
      format: Half-day review + memo.
      link: Email about a review →
      subject: Trust design review
    - name: Regulation as roadmap
      who: For CFOs and compliance leads
      question: Which controls need no human, what a regulator will accept.
      belief: >-
        The shape of future commerce is already written in the AI Act, GENIUS
        Act, MiCA, and AML law. The review reads them together.
      format: Review + build list.
      link: Email about a roadmap →
      subject: Regulation as roadmap

