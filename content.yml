      text: Building at the FMX AI Vibe Check hackathon
      place: Munich
      link: ""
    - date: Date tba                        # TODO
      text: Building at the financial services hackathon
      place: London
      link: ""
    - date: Date tba                        # TODO
      text: Lean in Munich meetup
      place: Munich
      link: ""
  hook: If you're there, email me and we'll find twenty minutes.

contact:
  text: If any of this is a problem you have, email me. A first conversation costs nothing.

